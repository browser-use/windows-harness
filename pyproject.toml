[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "windows-harness"
version = "0.2.0"
description = "The simplest, thinnest harness that gives an LLM complete freedom to complete virtually any task on Windows."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "warmshao" }]
keywords = ["agent", "harness", "windows", "automation", "uia", "computer-use"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pillow>=10.0",
    "pywin32>=306",
    "uiautomation>=2.0.26",
]

[project.scripts]
windows-harness = "windows_harness.cli:main"

[project.urls]
Homepage = "https://github.com/warmshao/windows-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
